<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Map Quiz</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--sea:#0d1720;--land:#2a3a4b;--land-hi:#38506a;--line:#0d1720;--ok:#3aa874;--bad:#e0524d;--gold:#f0b54a;--ink:#e8eef4;--mute:#8ea0b2;--panel:#152230;--edge:#25364a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--sea);color:var(--ink);font:15px/1.4 system-ui,"Segoe UI",sans-serif;overflow:hidden}
#map{position:absolute;inset:0;cursor:grab}#map.drag,#map.drag *{cursor:grabbing!important}
.c[data-s=on],.hit:not([data-s=off]){cursor:pointer}svg{width:100%;height:100%;display:block}
.c{fill:var(--land);transition:fill .3s;stroke:var(--line);stroke-width:.7;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.c[data-s=off]{fill:#1c2835}.c[data-s=on]:hover{fill:var(--land-hi)}.c[data-s=ok]{fill:var(--ok)}.c[data-s=skip]{fill:#7a4b4b}
.c.bad,.c.hint{fill:var(--bad)!important}.c.hint{animation:p .7s infinite alternate}.c.okf{fill:var(--ok)!important}.c.skf{fill:#a06666!important}
@keyframes p{to{opacity:.55}}
.dot{transition:fill .3s;fill:#9fb4c8;stroke:var(--sea);stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.dot[data-s=off]{fill:#33465a}.dot[data-s=ok]{fill:var(--ok)}.dot[data-s=skip]{fill:#a06666}.dot.bad,.dot.hint{fill:var(--bad)}.dot.okf{fill:var(--ok)}.dot.skf{fill:#a06666}
.hit{fill:transparent;cursor:pointer}.hit[data-s=off]{pointer-events:none}
.bar{position:absolute;z-index:5;display:flex;gap:8px;align-items:center}
.panel,button,select{background:var(--panel);border:1px solid var(--edge);color:var(--ink);border-radius:8px;font:inherit}
button,select{padding:7px 12px;cursor:pointer}button:hover{border-color:var(--mute)}button:focus-visible,select:focus-visible{outline:2px solid var(--gold)}
button.pri{background:var(--gold);color:#1b1405;border-color:var(--gold);font-weight:600}
#top{top:12px;left:12px;right:12px;justify-content:space-between;pointer-events:none}#top>*{pointer-events:auto}
#task{padding:8px 18px;display:flex;gap:14px;align-items:center;min-width:220px;justify-content:center}
#task .nm{font:600 24px Georgia,"Times New Roman",serif}.fl{height:34px;border-radius:3px;display:block}.fe{font-size:34px;line-height:1;font-family:Flags,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}

const nm=id=>{try{const x=dn[S.lang].of(id);if(x&&x!==id)return x}catch(e){}return byId[id].n};
const flag=(id,h)=>FLAGS[id]?`<img class="fl" src="${FLAGS[id]}" alt="">`:`<span class="fe">${String.fromCodePoint(...[...id].map(ch=>127397+ch.charCodeAt(0)))}</span>`;
const inReg=(id,r)=>r==='World'||byId[id].r===r;

/* ===== Map drawing ===== */
const NS='http://www.w3.org/2000/svg',els={},dots=[];
function mk(tag,at,par){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);par.appendChild(e);return e}
DATA.forEach(c=>{
 els[c.id]=[];
 if(c.d){const p=mk('path',{d:c.d,class:'c','data-id':c.id},$('land'));els[c.id].push(p)}
 if(c.a<6||!c.d){ // micro-state: visible dot + oversized invisible hit area (like Seterra)
  const g={cx:c.c[0],cy:c.c[1]};
  const dot=mk('circle',{...g,class:'dot'},$('dots')),hit=mk('circle',{...g,class:'hit','data-id':c.id},$('dots'));
  dots.push({dot,hit});els[c.id].push(dot,hit)}
});
const cur={k:1,x:0,y:0},tgt={k:1,x:0,y:0};let K0=1;
const box=()=>$('map').getBoundingClientRect();
function fitWorld(){const b=box();K0=Math.min(b.width/(360*S_),b.height/(150*S_));return viewOf(VIEWS.World)}
function viewOf(v){const b=box(),x0=(v[0]+180)*S_,x1=(v[2]+180)*S_,y0=(90-v[3])*S_,y1=(90-v[1])*S_;
 const k=Math.min(b.width/(x1-x0),b.height/(y1-y0))*.92;return{k,x:b.width/2-k*(x0+x1)/2,y:b.height/2-k*(y0+y1)/2}}
function go(v,instant){Object.assign(tgt,v);if(instant)Object.assign(cur,v);raf()}
let anim=0;function raf(){if(!anim)anim=requestAnimationFrame(step)}
function step(){anim=0;let m=0;for(const q of['k','x','y']){const d=tgt[q]-cur[q];cur[q]+=d*.22;m=Math.max(m,Math.abs(d)/(q==='k'?cur.k:1))}
 if(m<.001)Object.assign(cur,tgt);draw();if(cur.k!==tgt.k||cur.x!==tgt.x||cur.y!==tgt.y)raf()}
function draw(){$('w').setAttribute('transform',`translate(${cur.x} ${cur.y}) scale(${cur.k})`);
 const r=5/cur.k;dots.forEach(o=>{o.dot.setAttribute('r',r);o.hit.setAttribute('r',r*2.4)})}
function zoomAt(f,px,py){const k=Math.min(Math.max(tgt.k*f,K0*.9),K0*60),r=k/tgt.k;tgt.x=px-(px-tgt.x)*r;tgt.y=py-(py-tgt.y)*r;tgt.k=k;raf()}
const M=$('map');let drag=null,moved=0;
M.addEventListener('wheel',e=>{e.preventDefault();const b=box();zoomAt(Math.exp(-e.deltaY*.0016),e.clientX-b.left,e.clientY-b.top)},{passive:false});
M.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY};moved=0});
addEventListener('mousemove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);if(moved>4)M.classList.add('drag');
 tgt.x+=dx;tgt.y+=dy;cur.x=tgt.x;cur.y=tgt.y;cur.k=tgt.k;drag={x:e.clientX,y:e.clientY};draw()});
addEventListener('mouseup',()=>{drag=null;M.classList.remove('drag')});
M.addEventListener('click',e=>{if(moved>4){moved=0;return}const id=e.target.dataset&&e.target.dataset.id;if(id)onClick(id,e)});
$('zi').onclick=()=>{const b=box();zoomAt(1.6,b.width/2,b.height/2)};
$('zo').onclick=()=>{const b=box();zoomAt(1/1.6,b.width/2,b.height/2)};
$('zr').onclick=()=>go(fitWorld());
$('zg').onclick=()=>go(viewOf(VIEWS[(S.game||{reg:S.set.reg}).reg||S.set.reg]));

/* ===== Game logic ===== */
let G=null;                      // = S.game (persisted)
const now=()=>performance.now();
const gt=()=>G.t+(G.run?Date.now()-G.ts:0);   // game time excludes pauses
const hold=()=>{if(G&&G.run){G.t+=Date.now()-G.ts;G.run=false}};
const unhold=()=>{if(G&&!G.run){G.ts=Date.now();G.run=true}};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(){const s=S.set,ids=DATA.filter(c=>inReg(c.id,s.reg)).map(c=>c.id);
 G=S.game={reg:s.reg,mode:s.mode,n:s.n,show:s.show,keep:s.keep!==false,order:shuffle(ids),i:0,done:{},left:s.n,pool:s.n,errors:0,score:0,first:0,t:0,ts:Date.now(),run:true,cs:0,wr:0,fin:false};
 save();show('');pv=null;paint();go(viewOf(VIEWS[G.reg]),true);next(true)}
const cid=()=>G.order[G.i];
function paint(){for(const id in els){els[id].forEach(e=>e.classList.remove('hint','bad','okf','skf'));state(id)}} // also clears leftover highlight classes (restart / change region)
function state(id){const k=G&&G.keep!==false,s=!G||!inReg(id,G.reg)?'off':k&&G.done[id]===1?'ok':k&&G.done[id]===0?'skip':'on'; // keep=false: found countries look normal and stay clickable
 els[id].forEach(e=>e.dataset.s=s)}
function next(first){while(G.i<G.order.length&&id_done(cid()))G.i++;
 if(G.i>=G.order.length)return finish();
 if(G.mode==='per')G.left=G.n;G.wr=0;G.cs=gt();render();if(!first)save()}
const id_done=id=>G.done[id]!==undefined;
function render(){
 const id=cid(),sh=G.show;
 $('task').innerHTML=(sh!=='name'?flag(id):'')+(sh!=='flag'?`<span class="nm">${nm(id)}</span>`:'');
 $('sc').textContent=G.score;$('prog').textContent=Object.keys(G.done).length+' / '+G.order.length;
 const inf=!G.n,v=G.mode==='per'?G.left:G.pool;
 $('att').innerHTML=inf?'<b>∞</b>':Array.from({length:G.n},(_,i)=>`<span class="pip ${i<v?'':'x'}"></span>`).join('')+`<span class="mute">&nbsp;${t(G.mode==='per'?'per':'glob')}</span>`}
function pop(txt,col,e){const p=document.createElement('div');p.id='pop';p.textContent=txt;p.style.color=col;p.style.left=(e?e.clientX:innerWidth/2)+'px';p.style.top=(e?e.clientY:120)+'px';document.body.appendChild(p);
 requestAnimationFrame(()=>{p.style.transform='translateY(-40px)';p.style.opacity=0});setTimeout(()=>p.remove(),1000)}
function flash(id,cls,ms){els[id].forEach(e=>e.classList.add(cls));if(ms)setTimeout(()=>els[id].forEach(e=>e.classList.remove(cls)),ms)}
function onClick(id,e){
 if(!G||G.fin||!G.run||!inReg(id,G.reg))return;
 if(id_done(id)){if(G.keep===false)flash(id,G.done[id]===1?'okf':'skf',1000);return} // re-click on an already found country: just a 1 s colour flash, no penalty
 if(id===cid()){
  const bonus=Math.round(BONUS*Math.max(0,1-(gt()-G.cs)/BTIME)),gain=Math.max(0,BASE-PEN*G.wr+bonus);
  G.score+=gain;if(G.wr===0)G.first++;G.done[id]=1;state(id);if(G.keep===false)flash(id,'okf',1000);pop('+'+gain,'#3aa874',e);G.i++;next();
 }else{
  G.errors++;G.wr++;flash(id,'bad',450);
  if(G.n){if(G.mode==='per')G.left--;else G.pool--;}
  const pen=Math.min(PEN,G.score);G.score-=pen;pop('−'+PEN,'#e0524d',e);render();save();
  if(G.n&&(G.mode==='per'?G.left:G.pool)<=0)exhaust();}
}
let pv=null; // camera before it jumped to the missed country; restored on Continue
function focusOn(id){const c=byId[id],[x0,y0,x1,y1]=c.b||[c.c[0]-20,c.c[1]-20,c.c[0]+20,c.c[1]+20],bx=box(),
 w=Math.max(x1-x0,40),h=Math.max(y1-y0,40),cx=(x0+x1)/2,cy=(y0+y1)/2,k=Math.min(Math.min(bx.width/w,bx.height/h)*.55,K0*60);
 go({k,x:bx.width/2-k*cx,y:bx.height*.45-k*cy})}
function exhaust(){hold();const id=cid();pv={...tgt};flash(id,'hint');focusOn(id);$('mT').textContent=t('itwas');
 $('mC').innerHTML=flag(id)+`<span style="font:600 22px Georgia,serif">${nm(id)}</span>`;$('miss').classList.add('show');save()}
$('mCont').onclick=()=>{const id=cid();els[id].forEach(e=>e.classList.remove('hint'));G.done[id]=0;state(id);G.i++;$('miss').classList.remove('show');unhold();if(pv)go(pv);
 if(G.mode==='glob'&&G.n&&G.pool<=0)finish();else next()};
$('mRst').onclick=()=>{$('miss').classList.remove('show');paint();newGame()};
function finish(){hold();G.fin=true;const ok=Object.values(G.done).filter(v=>v===1).length,tot=G.order.length;
 const rec={reg:G.reg,score:G.score,time:G.t,err:G.errors,pct:Math.round(100*G.first/tot),d:Date.now()};S.recent=[rec,...S.recent].slice(0,5);save();
 const f=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
 $('eT').textContent=t('done')+' — '+t(G.reg);
 $('eTab').innerHTML=[[t('time'),f(G.t)],[t('pts'),G.score],[t('err'),G.errors],[t('first'),rec.pct+'% ('+G.first+'/'+tot+')']].map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td></tr>`).join('')+
  `<tr><td colspan=2 class="mute" style="padding-top:12px">${t('last')}</td></tr>`+S.recent.slice(1).map(r=>`<tr><td class="mute">${t(r.reg)}</td><td class="mute">${r.score} · ${f(r.time)}</td></tr>`).join('');
 show('end')}
$('eAgain').onclick=()=>newGame();
$('eChg').onclick=()=>{G=S.game=null;save();paint();show('start');ui()};

/* ===== Screens & settings ===== */
function show(n){if(n!=='pause')$('miss').classList.remove('show');['start','pause','end'].forEach(s=>$(s).classList.toggle('show',s===n))}
function seg(id,opts,val,fn){const el=$(id);el.innerHTML='';opts.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;if(v===val)b.className='sel';b.onclick=()=>{fn(v);save();ui()};el.appendChild(b)})}
function ui(){
 document.documentElement.lang=S.lang;const s=S.set;
 $('tTitle').textContent=t('title');$('tSub').textContent=t('sub');$('lReg').textContent=t('reg');$('lMode').textContent=t('mode');$('lN').textContent=t('n');$('lShow').textContent=t('show');$('lLang').textContent=t('lang');
 $('lKeep').textContent=t('keep');$('keep').checked=s.keep!==false;$('bGo').textContent=t('go');$('bMenu').textContent=t('menu');$('lSc').textContent=t('score');$('zr').textContent=t('reset');$('zg').textContent=t('zreg');
 $('pT').textContent=t('paused');$('pRes').textContent=t('res');$('pRst').textContent=t('rst');$('pMenu').textContent=t('chg');$('pL').textContent=t('lang');
 $('mCont').textContent=t('cont');$('mRst').textContent=t('rst');$('eAgain').textContent=t('again');$('eChg').textContent=t('chg');
 seg('regs',REGS.map(r=>[r,t(r)]),s.reg,v=>s.reg=v);
 seg('mode',[['per',t('per')],['glob',t('glob')]],s.mode,v=>s.mode=v);
 seg('num',[[1,'1'],[3,'3'],[5,'5'],[0,'∞']],s.n,v=>s.n=v);
 seg('show',[['flag',t('flag')],['name',t('name')],['both',t('both')]],s.show,v=>s.show=v);
 const L=[['en','English'],['ru','Русский']],sl=v=>{S.lang=v};seg('lang',L,S.lang,sl);seg('lang2',L,S.lang,sl);
 if(G&&!G.fin)render();
}
$('keep').onchange=e=>{S.set.keep=e.target.checked;save()};
$('bGo').onclick=newGame;
$('bMenu').onclick=()=>{if(!G||G.fin)return;hold();show('pause');save()};
$('pRes').onclick=()=>{show('');if(!$('miss').classList.contains('show'))unhold();save()};
$('pRst').onclick=newGame;
$('pMenu').onclick=()=>{G=S.game=null;save();paint();show('start');ui()};
addEventListener('keydown',e=>{if(e.key==='Escape'&&G&&!G.fin&&G.run)$('bMenu').click()});
addEventListener('resize',()=>go(fitWorld(),true));

/* ===== Boot: restore saved game if there is one ===== */
go(fitWorld(),true);ui();
if(S.game&&!S.game.fin&&S.game.order){G=S.game;G.run=false;paint();go(viewOf(VIEWS[G.reg]),true);render();if(G.n&&(G.mode==='per'?G.left:G.pool)<=0)exhaust();else show('pause')}
else{S.game=null;paint()}
</script></body></html>
