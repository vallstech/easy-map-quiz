<!doctype html>
<!-- ============================================================================
     Map Quiz — page shell. Nothing but markup and the base (engine) stylesheet:
     every piece of behaviour lives in src/js/*.js and is inlined here by build.py
     in the order listed under `JS` in build.py.

     ::CSS::      <- src/skin.css            (design, inlined after the base CSS)
     ::SCRIPTS::  <- src/js/**/*.js          (core / game / ui modules, in order)
     ::DATA::     <- data/geojson/*.geojson  (inside core/config.js)
     ::FLAGS::    <- data/flags/*.svg        (inside core/config.js)
     ::FONT::     <- data/fonts/*.ttf        (inside the base CSS below)
     ========================================================================= -->
<html lang="en"><head><meta charset="utf-8"><title>Map Quiz</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--sea:#0d1720;--land:#2a3a4b;--land-hi:#38506a;--line:#0d1720;--ok:#3aa874;--bad:#e0524d;--gold:#f0b54a;--ink:#e8eef4;--mute:#8ea0b2;--panel:#152230;--edge:#25364a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--sea);color:var(--ink);font:15px/1.4 system-ui,"Segoe UI",sans-serif;overflow:hidden}
#map{position:absolute;inset:0;cursor:grab}#map.drag,#map.drag *{cursor:grabbing!important}
.c[data-s=on],.hit:not([data-s=off]){cursor:pointer}svg{width:100%;height:100%;display:block}
.c{fill:var(--land);transition:fill .3s;stroke:var(--line);stroke-width:.7;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.c[data-s=off]{fill:#1c2835}.c[data-s=on]:hover{fill:var(--land-hi)}.c[data-s=ok]{fill:var(--ok)}.c[data-s=skip]{fill:#7a4b4b}
.c.bad,.c.hint{fill:var(--bad)!important}.c.hint{animation:p .7s infinite alternate}.c.okf{fill:var(--ok)!important}.c.okf,.c.skf,.dot.okf,.dot.skf{transition:none}.c.fo,.dot.fo{transition:fill 1s}.c.skf{fill:#a06666!important}
@keyframes p{to{opacity:.55}}
.dot{transition:fill .3s;fill:#9fb4c8;stroke:var(--sea);stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.dot[data-s=off]{fill:#33465a}.dot[data-s=ok]{fill:var(--ok)}.dot[data-s=skip]{fill:#a06666}.dot.bad,.dot.hint{fill:var(--bad)}.dot.okf{fill:var(--ok)}.dot.skf{fill:#a06666}
.hit{fill:transparent;cursor:pointer}.hit[data-s=off]{pointer-events:none}
.bar{position:absolute;z-index:5;display:flex;gap:8px;align-items:center}
.panel,button,select{background:var(--panel);border:1px solid var(--edge);color:var(--ink);border-radius:8px;font:inherit}
button,select{padding:7px 12px;cursor:pointer}button:hover{border-color:var(--mute)}button:focus-visible,select:focus-visible{outline:2px solid var(--gold)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--gold);color:#1b1405;border-color:var(--gold);font-weight:600}
#top{top:12px;left:12px;right:12px;justify-content:space-between;pointer-events:none}#top>*{pointer-events:auto}
#task{padding:8px 18px;display:flex;gap:14px;align-items:center;min-width:220px;justify-content:center}
#task .nm{font:600 24px Georgia,"Times New Roman",serif}.fl{height:34px;border-radius:3px;display:block}.fe{font-size:34px;line-height:1;font-family:Flags,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
/*__FONT__*/
#score{padding:8px 14px;text-align:right;min-width:110px}#score b{font-size:22px;display:block}#score small,.mute{color:var(--mute)}
#zoom{left:12px;bottom:12px;flex-direction:column;align-items:stretch}#zoom button{width:100%}
#att{bottom:14px;left:50%;transform:translateX(-50%);padding:6px 14px;gap:6px}
.pip{width:12px;height:12px;border-radius:50%;background:var(--bad)}.pip.x{background:#33465a}
#pop{position:absolute;z-index:9;font-weight:700;pointer-events:none;transition:transform 1s,opacity 1s}
.dock{position:absolute;z-index:15;left:50%;bottom:60px;transform:translateX(-50%);display:none;align-items:center;gap:14px;padding:10px 16px;white-space:nowrap}.dock.show{display:flex}
/* start-screen sections: caption + divider line */
.sec{margin-top:16px;padding-top:12px;border-top:1px solid var(--edge)}
.sec h2{margin:0 0 2px;font:600 11px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.sec.foot{display:flex;justify-content:space-between;align-items:center;gap:12px}
input[type=number]{width:64px;background:var(--panel);border:1px solid var(--edge);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit}
#pop{white-space:nowrap}
#pop.neg{z-index:40;font-size:24px;font-weight:800;letter-spacing:.2px;padding:.14em .55em;border-radius:999px;background:#0d1720f2;border:.1em solid #ffd447;box-shadow:0 4px 18px #000c,0 0 0 2px #000;text-shadow:0 1px 2px #000;animation:negPop 2.4s ease-out forwards}
@keyframes negPop{0%{opacity:0;transform:translate(-50%,0) scale(.6)}10%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}20%{transform:translate(-50%,-18px) scale(1)}78%{opacity:1;transform:translate(-50%,-30px) scale(1)}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}
input[type=range]{accent-color:var(--gold);width:150px}.sm{display:flex;gap:10px;align-items:center}.sm b{min-width:3ch;text-align:right}
input[type=checkbox]{accent-color:var(--gold);width:18px;height:18px}
.scr{position:absolute;inset:0;z-index:20;background:#0d1720ee;display:none;align-items:center;justify-content:center}
.scr.show{display:flex}.box{padding:26px 30px;width:min(520px,92vw);max-height:92vh;overflow:auto}
.box h1{margin:0 0 4px;font:700 30px Georgia,serif}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:12px 0}
.seg{display:flex;gap:6px;flex-wrap:wrap}.panel button.sel,.seg button.sel{background:#22384f;border-color:var(--gold)}
table{width:100%;border-collapse:collapse}td{padding:5px 0;border-bottom:1px solid var(--edge)}td:last-child{text-align:right}
/*__CSS__*/
</style></head><body>

<!-- map: land paths + micro-state dots (both built by core/map.js) -->
<div id="map"><svg id="svg"><g id="w"><g id="land"></g><g id="dots"></g></g></svg></div>

<!-- HUD: menu / restart, task, score -->
<div class="bar" id="top">
 <div class="panel" id="menu"><button id="bMenu"></button><button id="bRestart"></button></div>
 <div class="panel" id="task"></div>
 <div class="panel" id="score"><small id="lSc"></small><b id="sc">0</b><small id="prog"></small><div id="tmr"></div></div>
</div>

<!-- camera buttons + attempts pips -->
<div class="bar" id="zoom"><button id="zi">+</button><button id="zo">−</button><button id="zr"></button><button id="zg"></button></div>
<div class="bar panel" id="att"></div>

<!-- START SCREEN -->
<div class="scr show" id="start"><div class="panel box">
 <h1 id="tTitle"></h1><div class="mute" id="tSub"></div>

 <section class="sec"><h2 id="sGame"></h2>
  <div class="row"><span id="lReg"></span></div><div class="seg" id="regs"></div>
  <div class="row"><span class="mute" id="subInfo"></span><button id="bSub"></button></div>
  <div class="row"><span id="lReps"></span><input type="number" id="reps" min="1" max="10" step="1"></div>
 </section>

 <section class="sec"><h2 id="sRules"></h2>
  <div class="row"><span id="lMode"></span><div class="seg" id="mode"></div></div>
  <div class="row"><span id="lN"></span><div class="seg" id="num"></div></div>
  <label class="row"><span id="lHard"></span><input type="checkbox" id="hard"></label>
  <label class="row"><span id="lTm"></span><input type="checkbox" id="tm"></label>
 </section>

 <section class="sec"><h2 id="sShow"></h2>
  <div class="row"><span id="lShow"></span><div class="seg" id="show"></div></div>
  <label class="row"><span id="lSwr"></span><input type="checkbox" id="swr"></label>
  <div class="row"><span id="lPop"></span><div class="seg" id="popSeg"></div></div>
  <label class="row"><span id="lCam"></span><input type="checkbox" id="cam"></label>
  <div class="row"><span id="lSm"></span><span class="sm"><input type="range" id="smooth" min="0" max="10" step="1"><b id="smV"></b></span></div>
  <div class="row"><span id="lMap"></span><div class="seg" id="mapSeg"></div></div>
  <div class="mute" id="mapNote" style="font-size:13px;margin:-6px 0 4px"></div>
 </section>

 <section class="sec"><h2 id="sCtl"></h2>
  <div class="row"><span id="lRk"></span><button id="rkey"></button></div>
 </section>

 <section class="sec"><h2 id="sSite"></h2>
  <div class="row"><span id="lLang"></span><div class="seg" id="lang"></div></div>
 </section>

 <div class="sec foot"><span class="mute" id="stat"></span><button class="pri" id="bGo"></button></div>
</div></div>

<!-- SUB-REGION PICKER (body built by ui/screens.js) -->
<div class="scr" id="subs"><div class="panel box"><h1 id="subT"></h1><div class="mute" id="subSub"></div><div id="subBody"></div>
 <div class="sec foot"><button id="subClear"></button><button class="pri" id="subDone"></button></div></div></div>

<!-- PAUSE MENU -->
<div class="scr" id="pause"><div class="panel box"><h1 id="pT"></h1>
 <div class="row"><button class="pri" id="pRes"></button><button id="pRst"></button><button id="pMenu"></button></div>
 <div class="row"><span id="pL"></span><div class="seg" id="lang2"></div></div>
 <div class="row"><span id="pRk"></span><button id="rkey2"></button></div>
 <label class="row"><span id="pCam"></span><input type="checkbox" id="cam2"></label>
 <label class="row"><span id="pLock"></span><input type="checkbox" id="lock2"></label>
 <label class="row"><span id="pTm"></span><input type="checkbox" id="tm2"></label>
 <div class="row"><span id="pSm"></span><span class="sm"><input type="range" id="smooth2" min="0" max="10" step="1"><b id="smV2"></b></span></div></div></div>

<!-- MISSED COUNTRY -->
<div class="panel dock" id="miss"><span class="mute" id="mT"></span><span id="mC" style="display:flex;gap:10px;align-items:center"></span><button class="pri" id="mCont"></button><button id="mRst"></button></div>

<!-- FINAL STATS (table built by game/game.js) -->
<div class="scr" id="end"><div class="panel box"><h1 id="eT"></h1><table id="eTab"></table>
 <div class="row"><button class="pri" id="eAgain"></button><button id="eChg"></button></div></div></div>

<script>
/*__SCRIPTS__*/
</script></body></html>
